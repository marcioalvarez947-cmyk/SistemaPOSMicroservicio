spring.application.name=ms-inventario
server.port=${SERVER_PORT:8003}

# --- Base de datos (en Docker se sobreescribe con variables de entorno) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_inventario}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Actuator (health check para Docker) ---
management.endpoints.web.exposure.include=health,info
