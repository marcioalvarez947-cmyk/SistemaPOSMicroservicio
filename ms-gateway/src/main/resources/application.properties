spring.application.name=ms-gateway
server.port=${SERVER_PORT:8080}

# Rutas: el gateway es la única puerta de entrada. (Spring Cloud 2025.0+: prefijo server.webflux)
# Si tu versión no reconoce este prefijo, usa el anterior: spring.cloud.gateway.routes[...]
spring.cloud.gateway.server.webflux.routes[0].id=ms-cliente
spring.cloud.gateway.server.webflux.routes[0].uri=${MS_CLIENTE_URL:http://localhost:8001}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/clientes/**

spring.cloud.gateway.server.webflux.routes[1].id=ms-producto
spring.cloud.gateway.server.webflux.routes[1].uri=${MS_PRODUCTO_URL:http://localhost:8002}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/productos/**,/api/v1/categorias/**

spring.cloud.gateway.server.webflux.routes[2].id=ms-inventario
spring.cloud.gateway.server.webflux.routes[2].uri=${MS_INVENTARIO_URL:http://localhost:8003}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/inventario/**

spring.cloud.gateway.server.webflux.routes[3].id=ms-ventas
spring.cloud.gateway.server.webflux.routes[3].uri=${MS_VENTAS_URL:http://localhost:8004}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/ventas/**

spring.cloud.gateway.server.webflux.routes[4].id=ms-compras
spring.cloud.gateway.server.webflux.routes[4].uri=${MS_COMPRAS_URL:http://localhost:8005}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/proveedores/**,/api/v1/ordenes-compra/**

management.endpoints.web.exposure.include=health,info
