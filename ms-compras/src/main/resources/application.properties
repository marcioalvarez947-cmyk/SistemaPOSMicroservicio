spring.application.name=ms-compras
server.port=${SERVER_PORT:8005}

# --- Base de datos (en Docker se sobreescribe con variables de entorno) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_compras}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Actuator (health check para Docker) ---
management.endpoints.web.exposure.include=health,info

# --- URLs de los otros microservicios (Feign) ---
ms.producto.url=${MS_PRODUCTO_URL:http://localhost:8002}
ms.inventario.url=${MS_INVENTARIO_URL:http://localhost:8003}

# --- Timeouts de Feign (milisegundos) ---
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

logging.level.com.pos.compras.clients=DEBUG
